<section class="arch-panel" id="panel-physical" aria-labelledby="title-physical">
  
  <h2 class="arch-panel-title" id="title-physical">
    I. The Physical Picture
    <span style="font-family: var(--font-mono); font-size: 0.6rem; color: var(--ink-ghost);">Reference Frame</span>
  </h2>

  <!-- Interactive Orrery Container -->
  <div class="arch-orrery-container">
    
    <canvas id="orrery-canvas" class="arch-orrery-canvas" width="800" height="500"></canvas>

    <!-- Overlay Reference Frame Selector -->
    <div class="arch-canvas-controls">
      <button class="arch-btn active" id="btn-frame-helio" onclick="setReferenceFrame('helio')">Heliocentric (Sun)</button>
      <button class="arch-btn" id="btn-frame-geo" onclick="setReferenceFrame('geo')">Geocentric (Earth)</button>
    </div>

    <!-- Right Overlay: Visibility Toggles -->
    <div style="position: absolute; top: var(--space-sm); right: var(--space-sm); z-index: 10; display: flex; flex-direction: column; gap: 4px; background: rgba(16, 13, 8, 0.7); padding: 6px; border-radius: 4px; border: 1px solid rgba(196,169,125,0.15);">
      <label style="display: flex; align-items: center; gap: var(--space-xs); font-family: var(--font-mono); font-size: 0.58rem; color: var(--parchment-light); cursor: pointer;">
        <input type="checkbox" id="toggle-orbits" checked onchange="toggleOverlay('orbits')"> Orbits
      </label>
      <label style="display: flex; align-items: center; gap: var(--space-xs); font-family: var(--font-mono); font-size: 0.58rem; color: var(--parchment-light); cursor: pointer;">
        <input type="checkbox" id="toggle-epicycles" checked onchange="toggleOverlay('epicycles')"> Epicycles
      </label>
      <label style="display: flex; align-items: center; gap: var(--space-xs); font-family: var(--font-mono); font-size: 0.58rem; color: var(--parchment-light); cursor: pointer;">
        <input type="checkbox" id="toggle-equants" checked onchange="toggleOverlay('equants')"> Equant Points
      </label>
    </div>

  </div>

</section>
