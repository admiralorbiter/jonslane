<section class="arch-panel" id="panel-observable" aria-labelledby="title-observable">
  
  <h2 class="arch-panel-title" id="title-observable">
    II. The Observable Sky (Ecliptic Longitude)
    <span style="font-family: var(--font-mono); font-size: 0.6rem; color: var(--ink-ghost);">Naked-Eye View</span>
  </h2>

  <!-- Sky longitude strip -->
  <div class="arch-sky-strip-container">
    <canvas id="sky-strip-canvas" class="arch-sky-strip-canvas" width="1000" height="90"></canvas>
  </div>

  <p style="font-family: var(--font-serif); font-size: 0.72rem; color: var(--ink-fade); margin-top: 6px; line-height: 1.4; font-style: italic; margin-bottom: 0;">
    The strip shows the apparent position of Mars on the ecliptic plane (0° to 360°).
    Watch Mars slow down, stop, and reverse direction (retrograde motion) against the starry constellations.
  </p>

</section>
