{% extends "base.html" %}

{% block title %}Count Me In | Connect{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/game.css') }}">
<style>
    .auth-container {
        max-width: 450px;
        margin: 120px auto 60px;
        padding: 0 20px;
    }
    .auth-card {
        border-top: 3px solid var(--neon-cyan);
    }
    .form-group {
        margin-bottom: 20px;
        text-align: left;
    }
    .form-label {
        display: block;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-secondary);
        margin-bottom: 8px;
    }
    .form-input {
        width: 100%;
        background: rgba(13, 15, 18, 0.8);
        border: 2px solid var(--border-color);
        border-radius: 8px;
        padding: 12px 16px;
        font-size: 1rem;
        color: var(--text-primary);
        transition: all 0.2s ease;
        font-family: inherit;
    }
    .form-input:focus {
        outline: none;
        border-color: var(--neon-cyan);
        box-shadow: 0 0 10px rgba(0, 240, 255, 0.2), inset 0 2px 5px rgba(0, 0, 0, 0.5);
    }
    .auth-footer {
        margin-top: 25px;
        text-align: center;
        font-size: 0.9rem;
        color: var(--text-secondary);
    }
    .auth-footer a {
        color: var(--neon-cyan);
        text-decoration: none;
        font-weight: 600;
        transition: text-shadow 0.2s;
    }
    .auth-footer a:hover {
        text-shadow: 0 0 5px var(--neon-cyan);
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="glass-card auth-card">
        <header style="text-align: center; margin-bottom: 30px;">
            <h1 class="cyber-title" style="font-size: 1.8rem; margin-bottom: 10px;">Connect</h1>
            <p style="color: var(--text-secondary); font-size: 0.95rem;">Access your synced tempo training data</p>
        </header>

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" name="email" class="form-input" required autocomplete="email" placeholder="dj@example.com">
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-input" required autocomplete="current-password" placeholder="••••••••">
            </div>

            <button type="submit" class="btn-submit" style="margin-top: 10px; width: 100%;">Connect Session</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="{{ url_for('auth.register') }}">Initialize Here</a>
        </div>
    </div>
</div>
{% endblock %}
